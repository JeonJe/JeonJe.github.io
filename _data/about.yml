intro: "더 잘하고 싶은 마음으로 부족함을 채워 나가고 있습니다. 문제를 만나면 \"왜?\"를 끝까지 따라가 보고, 알게 된 것은 글로 남깁니다. 요즘은 AI와 함께, 그리고 동료들과 함께 더 잘 일하는 방법을 찾고 있습니다."

timeline:
  title: "Timeline"
  years:
    - year: "2026"
      theme: "함께하기"
      story: >-
        경험이 쌓일수록 혼자 고민할 때보다 함께 부딪힐 때 더 멀리 간다는 걸 느꼈다. 함께 성장한다는 건 서로를 이끌기도 하고, 또 따라가기도 하는 일이었다. 그래서 요즘은 "나는 팀에 무엇을 줄 수 있지?"를 자주 생각한다. 밖에서 배운 것을 팀에 가져와 써 보고, 알게 된 것은 글로 나누고 있다.
